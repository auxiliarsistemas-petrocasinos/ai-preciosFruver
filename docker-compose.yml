services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - evidence_data:${EVIDENCE_STORAGE_PATH:-/var/lib/ai-precios-fruver/evidence}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_precios_fruver}
      POSTGRES_USER: ${POSTGRES_USER:-ai_precios_fruver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  evidence_data:

